# On a push to main, test on Linux, build the engine as release.yml does, and push
# ghcr.io/<owner>/torrential:latest, :main and :sha-<commit> for linux/amd64 and linux/arm64.
# nexxeln/torrential publishes its image from release.yml instead, so this skips it.
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  test:
    if: github.repository != 'nexxeln/torrential'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: cargo fmt --all --check
      - uses: ./.github/actions/toolchain
        with:
          target: x86_64-unknown-linux-musl
          kind: test
      - run: scripts/release.sh test

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          kind: build
      - run: scripts/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: torrential-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: torrential-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Put each architecture's binary where the Dockerfile looks for it
        run: |
          mkdir -p image/amd64 image/arm64
          tar -xzf dist/torrential-x86_64-unknown-linux-musl.tar.gz -C image/amd64
          tar -xzf dist/torrential-aarch64-unknown-linux-musl.tar.gz -C image/arm64
      - name: Check the amd64 image runs
        run: |
          docker build -t torrential:check .
          docker run --rm torrential:check --version
      - name: Build the image for amd64 and arm64 and push it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # GHCR names must be lowercase.
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/torrential"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --build-arg IMAGE="$image" \
            -t "$image:latest" -t "$image:main" -t "$image:sha-${SHA::7}" .
          echo "pushed $image:latest" >> "$GITHUB_STEP_SUMMARY"
