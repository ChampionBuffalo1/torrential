name: install

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version the installer should report, such as 0.1.3
        required: true

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install with the one-liner
        env:
          WANT: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          want=${WANT#v}
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL https://raw.githubusercontent.com/nexxeln/torrential/main/install.sh | sh
            got=$("$HOME/.local/bin/torrential" --version)
            echo "$got"
            [ "$got" = "torrential $want" ] && exit 0
            echo "expected torrential $want; retrying in 20s"
            sleep 20
          done
          exit 1

  image:
    # A version tag pushed ghcr.io/nexxeln/torrential:<version>; it becomes latest only once the release is out.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Point ghcr.io/nexxeln/torrential:latest at this release's image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t ghcr.io/nexxeln/torrential:latest "ghcr.io/nexxeln/torrential:${TAG#v}"
          docker buildx imagetools inspect ghcr.io/nexxeln/torrential:latest
